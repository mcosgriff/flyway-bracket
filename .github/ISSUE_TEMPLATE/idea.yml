name: I have an idea
description: Something is hard to do, or something is missing.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Flyway Bracket.

        Everyone can read what you write here. Please do not include where you live, your invite code or your account details.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you have?
      description: Tell us what you wanted to do and what got in the way. The problem helps us more than a solution.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What did you try?
      description: Tell us how you get around the problem today. If you found no way, say so.
    validations:
      required: true
