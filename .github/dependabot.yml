version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      # Wait until a version has been out for 5 days; a bad release is usually caught and pulled by then.
      # Security updates ignore this.
      default-days: 5
    ignore:
      # Robolectric's Android jar is a build named by each Robolectric release, so it moves only with
      # `robolectric` (libs.versions.toml says how). On its own it would run the tests on an Android jar
      # this Robolectric doesn't know.
      - dependency-name: "org.robolectric:android-all-instrumented"
    groups:
      # Kotlin and its compiler plugins must move together.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      androidx:
        patterns:
          - "androidx.*"
      # The server's framework: its modules are released together and must be one version.
      ktor:
        patterns:
          - "io.ktor*"
      everything-else:
        patterns:
          - "*"

  # The base image of the server's container (server/Dockerfile).
  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5

  # pa11y, the accessibility check of the user guide (site/package.json). Nothing here ships in the app
  # or on the site.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      site-checks:
        patterns:
          - "*"

  # The Worker in front of the hosted server (worker/package.json): wrangler, the containers library and
  # the TypeScript types and compiler. One group, so they move together.
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      worker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
