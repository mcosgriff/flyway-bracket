# Read by actions/dependency-review-action in .github/workflows/dependencies.yml.

# Any known vulnerability, of any severity, in a dependency the PR adds or moves to.
fail-on-severity: low

# The app has no licence of its own yet, so only permissive licences are allowed in the APK and in
# the server's image: they fit whatever is chosen. Not listed, so a PR bringing one in stops for a decision: MPL, LGPL, GPL,
# EPL, CDDL, and anything proprietary or unknown.
allow-licenses:
  - Apache-2.0
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Zlib
  - CC0-1.0
  - Unlicense
