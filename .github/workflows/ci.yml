# Runs on every pull request and push to main.
# Action versions are pinned to commit SHAs; Dependabot keeps them current.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # the PR's merge commit and its first parent, the base branch's tip

      # A pull request that only changes docs (Markdown, docs/, LICENSE) skips the steps below and passes
      # in seconds. The job still runs, so a ruleset can require the `build` check: a paths filter on the
      # trigger would leave a required check waiting forever. Pushes to main and manual runs always do
      # everything.
      - name: Docs-only change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
            echo "$changed"
            if ! echo "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
              code=false
              echo "::notice::Docs-only change: tests, lint, builds and the Exodus scan skipped."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.changes.outputs.code == 'true'

      - name: Unit tests
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :domain:test testDebugUnitTest

      - name: Android lint
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew lintDebug

      # Release builds run R8; catches shrinking problems before a tag does. No signing secrets here,
      # so the APK is unsigned.
      - name: Debug + release builds
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      # Exodus Privacy's tracker scanner on that release APK: no tracker, and no permission that isn't in
      # .github/privacy/permissions.txt.
      - name: Exodus tracker scan
        if: steps.changes.outputs.code == 'true'
        run: .github/scripts/exodus-scan.sh app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/exodus"

      # Each test's output and the HTML report, for a failure that only happens here.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            */build/test-results/
            */build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: "*/build/reports/lint-results-debug.html"
          if-no-files-found: ignore
