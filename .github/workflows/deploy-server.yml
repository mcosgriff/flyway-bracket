# Deploys the league server to Cloudflare (docs/server/hosting.md): builds the server, then
# `wrangler deploy` in worker/ builds the image from server/Dockerfile, pushes it to Cloudflare's registry
# and deploys the Worker and its container together.
# Runs on a push to main that changes the server or what it is built from, or by hand. The job waits for
# approval in the `production` environment, which holds the Cloudflare API token.
# This workflow sees that token, so every action is pinned to a commit SHA (Dependabot keeps the pins
# current). The database credentials are Worker secrets, set by hand; this workflow never sees them.
name: deploy-server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'api/**'
      - 'domain/**'
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; one in progress is left to finish.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # No cache, as in release.yml: the deployed server is built from what dependency verification
      # checks, never from compiled outputs another workflow left in main's cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # server/Dockerfile copies build/install/server.
      - name: Build the server
        run: ./gradlew :server:installDist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Exactly the versions in worker/package-lock.json, wrangler among them.
      - name: Install the Worker's packages
        working-directory: worker
        run: npm ci

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
