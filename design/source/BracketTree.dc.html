<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bracket, tree view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.ink}}; font-family: Inter, system-ui, sans-serif">
<header style="padding: 20px 20px 10px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.5px; text-transform: uppercase">Spring bracket</h1>
<div style="display: flex; gap: 6px">
<a href="Bracket.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border: 1px solid {{c.sline}}; border-radius: 22px; font-size: 13px; font-weight: 600; color: {{c.ink}}; text-decoration: none; background: {{c.sf}}">List</a>
<a href="FullBracket.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border: 1px solid {{c.sline}}; border-radius: 22px; font-size: 13px; font-weight: 600; color: {{c.ink}}; text-decoration: none; background: {{c.sf}}">All 64</a>
</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: {{c.pri}}; font: inherit; font-size: 13px; font-weight: 600; color: {{c.onp}}">Songbirds</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid {{c.line}}; border-radius: 22px; background: {{c.sf}}; font: inherit; font-size: 13px; font-weight: 600; color: {{c.ink}}">Waterbirds</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid {{c.line}}; border-radius: 22px; background: {{c.sf}}; font: inherit; font-size: 13px; font-weight: 600; color: {{c.ink}}">Fliers</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid {{c.line}}; border-radius: 22px; background: {{c.sf}}; font: inherit; font-size: 13px; font-weight: 600; color: {{c.ink}}">Waterfowl</button>
</div>
</header>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px">
<div style="overflow-x: auto; padding: 0 20px">
<div style="display: flex; width: 764px; height: 568px">
<div style="width: 172px; display: flex; flex-direction: column">
<div style="height: 26px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: {{c.mut}}">Round of 64 · final</div>
<div style="height: 542px; display: flex; flex-direction: column">
<sc-for list="{{ r64 }}" as="s" hint-placeholder-count="16">
<div style="flex: 1; display: flex; align-items: center">
<div style="flex: 1; min-width: 0; box-sizing: border-box; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 1px solid {{ s.ln }}; border-radius: 6px; background: {{ s.bg }}; color: {{ s.fg }}; font-size: 12px; font-weight: {{ s.weight }}">
<span style="width: 16px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px">{{ s.seed }}</span>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.name }}</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px">{{ s.score }}</span>
</div>
</div>
</sc-for>
</div>
</div>
<sc-for list="{{ cols }}" as="col" hint-placeholder-count="4">
<div style="display: flex">
<div style="width: 16px; display: flex; flex-direction: column">
<div style="height: 26px"></div>
<div style="height: 542px; display: flex; flex-direction: column">
<sc-for list="{{ col.joins }}" as="j" hint-placeholder-count="4">
<div style="flex: 1; display: flex; align-items: center">
<div style="width: 8px; height: 50%; box-sizing: border-box; border: 1px solid {{ j.ln }}; border-left: 0"></div>
<div style="width: 8px; height: 0; border-top: 1px solid {{ j.ln }}"></div>
</div>
</sc-for>
</div>
</div>
<div style="width: 132px; display: flex; flex-direction: column">
<div style="height: 26px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: {{ col.lfg }}">{{ col.label }}</div>
<div style="height: 542px; display: flex; flex-direction: column">
<sc-for list="{{ col.slots }}" as="s" hint-placeholder-count="4">
<div style="flex: 1; display: flex; align-items: center">
<div style="flex: 1; min-width: 0; box-sizing: border-box; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 1px solid {{ s.ln }}; border-radius: 6px; background: {{ s.bg }}; color: {{ s.fg }}; font-size: 12px; font-weight: {{ s.weight }}">
<span style="width: 16px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px">{{ s.seed }}</span>
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.name }}</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px">{{ s.score }}</span>
</div>
</div>
</sc-for>
</div>
</div>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 0 20px; font-size: 12px; color: {{c.mut}}">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: {{c.tint}}; border: 1px solid {{c.pick}}"></span>Your pick</span>
<span>Percent: eligible players who logged it</span>
<span>Swipe for later rounds</span>
</div>
</main>
<nav aria-label="Main" style="height: 72px; display: flex; background: {{c.sf}}; border-top: 1px solid {{c.line}}">
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: {{c.mut}}; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="Bracket.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: {{c.pick}}; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h5v7h5M4 19h5v-7M14 12h6"/></svg>Bracket</a>
<a href="League.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: {{c.mut}}; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.600 2.900-6 6.500-6s6.500 2.400 6.500 6M16 4.800a3.500 3.500 0 0 1 0 6.400M18 14.500c2.200.8 3.500 2.800 3.500 5.500"/></svg>League</a>
<a href="Packs.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: {{c.mut}}; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>Packs</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
theme(d) {
return d
? {bg:"#0B1612",sf:"#14231C",sc:"#223329",ink:"#E8F0EB",mut:"#A3B3AA",line:"#2F4238",sline:"#647A6E",div:"#24352C",pri:"#0F6B56",onp:"#FFFFFF",onpm:"#D3EDE3",act:"#FF8A4C",onact:"#2B1000",pick:"#7FD8BC",tint:"#173A30",wbg:"#3A2A05",wln:"#D9A036",wtx:"#FFD58A",hot:"#FFA273",bar2:"#55685E",inv:"#E8F0EB",oninv:"#0B1612"}
: {bg:"#F4F6F1",sf:"#FFFFFF",sc:"#DDE3D8",ink:"#14231C",mut:"#4A5A51",line:"#C9D1C6",sline:"#8A968D",div:"#E3E8DF",pri:"#0B5D4B",onp:"#FFFFFF",onpm:"#E6F3EE",act:"#C2410C",onact:"#FFFFFF",pick:"#0B5D4B",tint:"#E6F3EE",wbg:"#FFF1D6",wln:"#B77400",wtx:"#6B4100",hot:"#9A330A",bar2:"#A9B3AB",inv:"#14231C",oninv:"#FFFFFF"};
}
renderVals() {
const c = this.theme(this.props.dark ?? false);
const names = ["N. House Wren", "Yellow Warbler", "Yellow-rumped", "C. Grackle", "L. Goldfinch", "Br-h. Cowbird", "W. Meadowlark", "Chipping Sp.", "Bullock's Oriole", "W. Tanager", "Gray Catbird", "Warbling Vireo", "Blk-h. Grosbeak", "Yel-br. Chat", "White-cr. Sp.", "Lazuli Bunting"];
const order = [1, 16, 8, 9, 5, 12, 4, 13, 6, 11, 3, 14, 7, 10, 2, 15];
const upsets = { "8-9": 9, "5-12": 12 };
const mine = { "4-12": 12, "3-6": 6 };
const live = { 1: "88%", 9: "31%", 4: "50%", 12: "67%", 3: "58%", 6: "54%", 2: "71%", 7: "44%" };
const adv = (list, map) => { const o = []; for (let i = 0; i < list.length; i += 2) { const a = list[i], b = list[i + 1]; const k = Math.min(a, b) + "-" + Math.max(a, b); o.push(map[k] || Math.min(a, b)); } return o; };
const r32 = adv(order, upsets), s16 = adv(r32, mine), e8 = adv(s16, mine), top = adv(e8, mine);
const slot = (seed, kind) => {
const base = { seed: seed, name: names[seed - 1], score: "" };
if (kind === "out") return Object.assign(base, { bg: "transparent", fg: c.mut, weight: 400, ln: c.line });
if (kind === "pick") return Object.assign(base, { bg: c.tint, fg: c.pick, weight: 600, ln: c.pick });
if (kind === "live") return Object.assign(base, { score: live[seed], bg: c.sf, fg: c.ink, weight: 600, ln: c.line });
return Object.assign(base, { bg: c.sf, fg: c.ink, weight: 600, ln: c.line });
};
const col = (label, list, kind) => ({ label: label, lfg: kind === "live" ? c.hot : c.mut, slots: list.map((s) => slot(s, kind)), joins: list.map(() => ({ ln: c.sline })) });
return {
c: c,
r64: order.map((s) => slot(s, r32.indexOf(s) >= 0 ? "won" : "out")),
cols: [col("Round of 32 · live", r32, "live"), col("Sweet 16", s16, "pick"), col("Elite 8", e8, "pick"), col("Final Four", top, "pick")]
};
}
}
</script>
</body>
</html>
